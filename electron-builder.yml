appId: com.hypr.app
productName: Hypr

directories:
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!*.md'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{pnpm-lock.yaml,.npmrc,.env,.env.*}'

asar: true

asarUnpack:
  - resources/**

win:
  target:
    - nsis
  executableName: hypr

nsis:
  artifactName: hypr-${version}-setup.${ext}
  shortcutName: Hypr
  uninstallDisplayName: Hypr
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Utility

mac:
  notarize: false

npmRebuild: false
